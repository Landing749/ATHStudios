<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATHStudios — Inbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:         #070707;
      --s1:         #0c0c0c;
      --s2:         #101010;
      --s3:         #141414;
      --border:     #1a1a1a;
      --border2:    #242424;
      --gold:       #c9a84c;
      --gold2:      #e8c97e;
      --gold-dim:   rgba(201,168,76,.1);
      --gold-glow:  rgba(201,168,76,.06);
      --text:       #e4dfd6;
      --text2:      #a09890;
      --muted:      #5a5550;
      --support-bg: rgba(194,120,60,.1);
      --support-c:  #d4916a;
      --general-bg: rgba(90,130,190,.1);
      --general-c:  #85aad4;
      --privacy-bg: rgba(160,90,190,.1);
      --privacy-c:  #b890d4;
      --bug-bg:     rgba(190,90,90,.1);
      --bug-c:      #d47070;
      --error:      #b85555;
      --sidebar-w:  300px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
    }

    /* grain */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none; opacity: .7;
    }

    /* ══════════════════════════════
       LOCK SCREEN
    ══════════════════════════════ */
    #lockScreen {
      position: fixed; inset: 0; z-index: 5000;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0;
    }
    #lockScreen.gone { display: none; }

    .lock-eyebrow {
      font-size: .62rem; letter-spacing: .32em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1.4rem;
    }
    .lock-wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem; font-weight: 300;
      color: var(--text); line-height: 1;
      margin-bottom: .4rem;
    }
    .lock-wordmark em { color: var(--gold); font-style: italic; }
    .lock-sub {
      font-size: .7rem; letter-spacing: .2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 3rem;
    }
    .lock-divider {
      width: 40px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin-bottom: 3rem;
    }

    .lock-field {
      width: 280px; position: relative; margin-bottom: .8rem;
    }
    .lock-field input {
      width: 100%; background: var(--s1);
      border: 1px solid var(--border2); color: var(--text);
      font-family: 'Jost', sans-serif; font-size: 1.4rem;
      letter-spacing: .6em; text-align: center;
      padding: .9rem 1rem; outline: none;
      transition: border-color .25s, box-shadow .25s;
    }
    .lock-field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-dim);
    }
    .lock-field input.shake {
      animation: shk .35s ease;
      border-color: var(--error);
    }
    .lock-btn {
      width: 280px; background: transparent;
      border: 1px solid var(--gold); color: var(--gold);
      font-family: 'Jost', sans-serif; font-size: .7rem;
      letter-spacing: .26em; text-transform: uppercase;
      padding: .85rem; cursor: pointer;
      position: relative; overflow: hidden; transition: color .25s;
    }
    .lock-btn::before {
      content: ''; position: absolute; inset: 0;
      background: var(--gold); transform: scaleX(0);
      transform-origin: left;
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .lock-btn:hover::before { transform: scaleX(1); }
    .lock-btn span { position: relative; z-index: 1; }
    .lock-btn:hover span { color: #070707; }
    .lock-err {
      margin-top: .6rem; font-size: .7rem; letter-spacing: .1em;
      color: var(--error); text-align: center; height: 1rem;
    }

    @keyframes shk {
      0%,100% { transform: translateX(0); }
      25%,75%  { transform: translateX(-7px); }
      50%      { transform: translateX(7px); }
    }

    /* ══════════════════════════════
       APP SHELL
    ══════════════════════════════ */
    #app { display: flex; flex-direction: column; height: 100%; }

    /* ── TOP CHROME ── */
    .chrome {
      height: 48px; flex-shrink: 0;
      background: var(--s1); border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      justify-content: space-between; padding: 0 1.4rem;
      z-index: 10;
    }
    .chrome-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: .95rem; font-weight: 500;
      letter-spacing: .2em; text-transform: uppercase; color: var(--gold);
    }
    .chrome-right { display: flex; align-items: center; gap: .9rem; }
    .chrome-pill {
      font-size: .6rem; letter-spacing: .18em; text-transform: uppercase;
      padding: .22rem .75rem; border: 1px solid var(--border2); color: var(--muted);
    }
    .chrome-unread {
      font-size: .6rem; letter-spacing: .18em; text-transform: uppercase;
      padding: .22rem .75rem; border: 1px solid rgba(201,168,76,.3);
      color: var(--gold); background: var(--gold-dim);
    }
    .chrome-lock {
      font-family: 'Jost', sans-serif;
      font-size: .6rem; letter-spacing: .18em; text-transform: uppercase;
      background: none; border: 1px solid var(--border2);
      color: var(--muted); padding: .3rem .8rem; cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .chrome-lock:hover { color: var(--error); border-color: var(--error); }

    /* ── BODY ── */
    .body { display: flex; flex: 1; overflow: hidden; }

    /* ══════════════════════════════
       SIDEBAR
    ══════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--s1); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .sb-head {
      padding: 1rem 1.2rem .7rem;
      border-bottom: 1px solid var(--border);
    }
    .sb-head-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; font-weight: 400; letter-spacing: .04em;
      color: var(--text); margin-bottom: .7rem;
    }
    .sb-search { position: relative; }
    .sb-search input {
      width: 100%; background: var(--s2);
      border: 1px solid var(--border2); color: var(--text);
      font-family: 'Jost', sans-serif; font-size: .78rem;
      padding: .5rem .8rem .5rem 2rem; outline: none;
      transition: border-color .2s;
    }
    .sb-search input:focus { border-color: var(--gold); }
    .sb-search input::placeholder { color: var(--muted); opacity: .6; }
    .sb-search-icon {
      position: absolute; left: .65rem; top: 50%;
      transform: translateY(-50%); color: var(--muted); font-size: .78rem;
      pointer-events: none;
    }

    .sb-filters {
      display: flex; flex-wrap: wrap; gap: .3rem;
      padding: .7rem 1.2rem; border-bottom: 1px solid var(--border);
    }
    .sb-filter {
      font-family: 'Jost', sans-serif;
      font-size: .6rem; letter-spacing: .16em; text-transform: uppercase;
      background: none; border: 1px solid var(--border2);
      color: var(--muted); padding: .25rem .7rem; cursor: pointer;
      transition: all .18s;
    }
    .sb-filter:hover { color: var(--text2); }
    .sb-filter.active {
      border-color: var(--gold); color: var(--gold);
      background: var(--gold-dim);
    }

    .sb-list {
      flex: 1; overflow-y: auto; padding: .4rem 0;
    }
    .sb-list::-webkit-scrollbar { width: 3px; }
    .sb-list::-webkit-scrollbar-track { background: transparent; }
    .sb-list::-webkit-scrollbar-thumb { background: var(--border2); }

    .sb-item {
      padding: .85rem 1.2rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer; position: relative;
      transition: background .15s;
    }
    .sb-item:hover { background: var(--s2); }
    .sb-item.active { background: var(--s3); }
    .sb-item.active::after {
      content: '';
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 2px; background: var(--gold);
    }
    .sb-item.unread::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px; background: var(--gold);
    }
    .sb-item-top {
      display: flex; justify-content: space-between;
      align-items: center; gap: .5rem; margin-bottom: .3rem;
    }
    .sb-item-name {
      font-size: .82rem; font-weight: 400; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sb-item.unread .sb-item-name { color: var(--gold2); font-weight: 500; }
    .sb-item-time {
      font-size: .62rem; color: var(--muted); flex-shrink: 0; letter-spacing: .04em;
    }
    .sb-item-sub {
      font-size: .72rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sb-type-dot {
      display: inline-block; width: 5px; height: 5px;
      border-radius: 50%; margin-right: .35rem;
      vertical-align: middle; position: relative; top: -1px;
    }

    .sb-empty {
      padding: 3rem 1.5rem; text-align: center;
      color: var(--muted); font-size: .75rem; letter-spacing: .1em;
    }

    .sb-foot {
      border-top: 1px solid var(--border); padding: .8rem 1.2rem;
      display: flex; justify-content: space-between;
    }
    .sb-stat { text-align: center; }
    .sb-stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem; font-weight: 300; color: var(--gold); display: block;
    }
    .sb-stat-lbl {
      font-size: .58rem; letter-spacing: .16em;
      text-transform: uppercase; color: var(--muted);
    }

    /* ══════════════════════════════
       MAIN PANEL
    ══════════════════════════════ */
    .main {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; background: var(--bg);
    }

    /* ── TOP BAR ── */
    .topbar {
      flex-shrink: 0; min-height: 72px;
      background: var(--s1); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 2rem; gap: 1.4rem;
    }
    .topbar.empty { justify-content: center; }

    .topbar-avatar {
      width: 40px; height: 40px; flex-shrink: 0;
      background: var(--gold-dim); border: 1px solid rgba(201,168,76,.25);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-weight: 500; color: var(--gold);
    }
    .topbar-info { flex: 1; min-width: 0; }
    .topbar-name {
      font-size: .94rem; font-weight: 400; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-meta {
      display: flex; gap: .8rem; margin-top: .25rem;
      align-items: center; flex-wrap: wrap;
    }
    .topbar-email { font-size: .73rem; color: var(--text2); }
    .topbar-org   { font-size: .7rem;  color: var(--muted); }
    .topbar-sep   { width: 1px; height: 13px; background: var(--border2); }

    .topbar-actions { display: flex; align-items: center; gap: .5rem; }
    .tb-btn {
      font-family: 'Jost', sans-serif;
      font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
      background: none; border: 1px solid var(--border2);
      color: var(--muted); padding: .38rem .9rem; cursor: pointer;
      transition: all .18s; white-space: nowrap;
    }
    .tb-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .tb-btn.danger:hover { border-color: var(--error); color: var(--error); background: rgba(184,85,85,.08); }
    .tb-btn.primary { border-color: rgba(201,168,76,.35); color: var(--gold); background: var(--gold-dim); }
    .tb-btn.primary:hover { background: rgba(201,168,76,.2); }

    .topbar-empty-msg {
      font-size: .75rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
    }

    /* ── CONTENT PANE ── */
    .content-pane {
      flex: 1; overflow-y: auto; padding: 2.4rem 2.8rem;
    }
    .content-pane::-webkit-scrollbar { width: 3px; }
    .content-pane::-webkit-scrollbar-thumb { background: var(--border2); }

    .pane-empty {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
    }
    .pane-empty-glyph {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem; color: var(--border2); line-height: 1;
    }
    .pane-empty-txt {
      font-size: .72rem; letter-spacing: .16em;
      text-transform: uppercase; color: var(--muted);
    }

    .msg-header {
      margin-bottom: 2rem; padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .msg-subject {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem; font-weight: 300; line-height: 1.2;
      color: var(--text); margin-bottom: .9rem;
    }
    .msg-tags {
      display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    }
    .type-badge {
      font-size: .6rem; letter-spacing: .18em; text-transform: uppercase;
      padding: .28rem .8rem; border: 1px solid;
    }
    .badge-support { color: var(--support-c); border-color: rgba(212,145,106,.3); background: var(--support-bg); }
    .badge-general { color: var(--general-c); border-color: rgba(133,170,212,.3); background: var(--general-bg); }
    .badge-privacy { color: var(--privacy-c); border-color: rgba(184,144,212,.3); background: var(--privacy-bg); }
    .badge-bug     { color: var(--bug-c);     border-color: rgba(212,112,112,.3); background: var(--bug-bg); }
    .badge-unread  { color: var(--gold); border-color: rgba(201,168,76,.35); background: var(--gold-dim); }

    .msg-timestamp {
      font-size: .7rem; letter-spacing: .08em; color: var(--muted);
    }

    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .meta-cell { background: var(--s1); padding: .85rem 1.2rem; }
    .meta-lbl {
      font-size: .6rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--gold); margin-bottom: .3rem;
    }
    .meta-val { font-size: .85rem; color: var(--text); }

    .msg-body-label {
      font-size: .62rem; letter-spacing: .26em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem;
      display: flex; align-items: center; gap: .8rem;
    }
    .msg-body-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .msg-body {
      font-size: .92rem; line-height: 2; color: var(--text);
      opacity: .85; white-space: pre-wrap; word-break: break-word;
    }

    /* dot colors */
    .dot-support  { background: var(--support-c); }
    .dot-general  { background: var(--general-c); }
    .dot-privacy  { background: var(--privacy-c); }
    .dot-bug      { background: var(--bug-c); }
    .dot-license  { background: #c4a870; }
    .dot-feature  { background: #70c4a0; }
    .dot-document { background: #a0a0c4; }
    .dot-other    { background: var(--muted); }

    @media (max-width: 768px) {
      :root { --sidebar-w: 240px; }
      .content-pane { padding: 1.5rem 1.4rem; }
      .topbar { padding: 0 1.2rem; gap: .8rem; }
      .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- LOCK -->
<div id="lockScreen">
  <p class="lock-eyebrow">Restricted Access</p>
  <h1 class="lock-wordmark">Admin <em>Inbox</em></h1>
  <p class="lock-sub">ATHStudios — Internal Panel</p>
  <div class="lock-divider"></div>
  <div class="lock-field">
    <input id="pinInput" type="password" maxlength="8"
           placeholder="••••" inputmode="numeric" autocomplete="off" />
  </div>
  <button class="lock-btn" id="pinBtn"><span>Enter Inbox</span></button>
  <p class="lock-err" id="pinErr"></p>
</div>

<!-- APP -->
<div id="app">
  <div class="chrome">
    <span class="chrome-logo">ATHStudios</span>
    <div class="chrome-right">
      <span class="chrome-pill">Admin Panel</span>
      <span class="chrome-unread" id="chromUnread">— Unread</span>
      <button class="chrome-lock" id="lockBtn">Lock ⏏</button>
    </div>
  </div>

  <div class="body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-head-title">All Inquiries</div>
        <div class="sb-search">
          <span class="sb-search-icon">⌕</span>
          <input id="sbSearch" placeholder="Search name, email, subject…" autocomplete="off" />
        </div>
      </div>

      <div class="sb-filters">
        <button class="sb-filter active" data-f="all">All</button>
        <button class="sb-filter" data-f="unread">New</button>
        <button class="sb-filter" data-f="support">Support</button>
        <button class="sb-filter" data-f="general">General</button>
        <button class="sb-filter" data-f="bug">Bug</button>
        <button class="sb-filter" data-f="license">License</button>
        <button class="sb-filter" data-f="privacy">Privacy</button>
      </div>

      <div class="sb-list" id="sbList">
        <div class="sb-empty">Loading…</div>
      </div>

      <div class="sb-foot">
        <div class="sb-stat">
          <span class="sb-stat-num" id="sTotal">—</span>
          <span class="sb-stat-lbl">Total</span>
        </div>
        <div class="sb-stat">
          <span class="sb-stat-num" id="sUnread">—</span>
          <span class="sb-stat-lbl">Unread</span>
        </div>
        <div class="sb-stat">
          <span class="sb-stat-num" id="sSupport">—</span>
          <span class="sb-stat-lbl">Support</span>
        </div>
        <div class="sb-stat">
          <span class="sb-stat-num" id="sToday">—</span>
          <span class="sb-stat-lbl">Today</span>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar empty" id="topbar">
        <span class="topbar-empty-msg">Select an inquiry to view</span>
      </div>
      <div class="content-pane" id="contentPane">
        <div class="pane-empty">
          <div class="pane-empty-glyph">✉</div>
          <p class="pane-empty-txt">No inquiry selected</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, onValue, update, remove }
                           from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const PIN = "2025"; // ← change this

const firebaseConfig = {
  apiKey:            "AIzaSyCzwNkfGyESkZyI2og1wizPp11xdMygchM",
  authDomain:        "athstudios-2e26c.firebaseapp.com",
  projectId:         "athstudios-2e26c",
  storageBucket:     "athstudios-2e26c.firebasestorage.app",
  messagingSenderId: "876706493654",
  appId:             "1:876706493654:web:146741a963eb59054c4577",
  measurementId:     "G-LQG1SNRYJ9",
  databaseURL:       "https://athstudios-2e26c-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* LOCK */
const lockEl  = document.getElementById('lockScreen');
const pinInp  = document.getElementById('pinInput');
const pinErr  = document.getElementById('pinErr');

function unlock() {
  if (pinInp.value === PIN) {
    lockEl.classList.add('gone');
    sessionStorage.setItem('ath_in','1');
    boot();
  } else {
    pinInp.classList.add('shake');
    pinErr.textContent = 'Incorrect PIN.';
    pinInp.value = '';
    setTimeout(() => pinInp.classList.remove('shake'), 380);
  }
}
document.getElementById('pinBtn').addEventListener('click', unlock);
pinInp.addEventListener('keydown', e => e.key==='Enter' && unlock());
document.getElementById('lockBtn').addEventListener('click', () => {
  sessionStorage.removeItem('ath_in');
  lockEl.classList.remove('gone');
  pinInp.value = ''; pinErr.textContent = '';
});
if (sessionStorage.getItem('ath_in')==='1') { lockEl.classList.add('gone'); boot(); }

/* STATE */
let entries      = [];
let activeKey    = null;
let activeFilter = 'all';
let searchQ      = '';

const SUPPORT  = ['Technical Support'];
const BUG      = ['Bug Report'];
const LICENSE  = ['License Issue'];
const PRIVACY  = ['Data Privacy Concern'];
const ALL_SUPP = [...SUPPORT, ...BUG, ...LICENSE, ...PRIVACY];

function dotCls(type) {
  if (SUPPORT.includes(type))        return 'dot-support';
  if (BUG.includes(type))            return 'dot-bug';
  if (LICENSE.includes(type))        return 'dot-license';
  if (PRIVACY.includes(type))        return 'dot-privacy';
  if (type==='Feature Request')      return 'dot-feature';
  if (type==='Document Request')     return 'dot-document';
  return 'dot-general';
}
function badgeCls(type) {
  if (SUPPORT.includes(type))        return 'badge-support';
  if (BUG.includes(type)||LICENSE.includes(type)) return 'badge-bug';
  if (PRIVACY.includes(type))        return 'badge-privacy';
  return 'badge-general';
}

/* BOOT */
function boot() {
  onValue(ref(db,'contacts'), snap => {
    entries = [];
    if (snap.exists()) {
      snap.forEach(c => entries.push({ key: c.key, ...c.val() }));
      entries.sort((a,b) => new Date(b.submittedAt)-new Date(a.submittedAt));
    }
    updateStats(); renderSidebar();
    if (activeKey) {
      const e = entries.find(x => x.key===activeKey);
      e ? renderDetail(e) : clearDetail();
    }
  });

  document.getElementById('sbSearch').addEventListener('input', e => {
    searchQ = e.target.value; renderSidebar();
  });
  document.querySelectorAll('.sb-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sb-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.f;
      renderSidebar();
    });
  });
}

/* STATS */
function updateStats() {
  const now = new Date();
  const t = entries.length;
  const u = entries.filter(e=>e.status==='unread').length;
  const s = entries.filter(e=>ALL_SUPP.includes(e.type)).length;
  const d = entries.filter(e=>{
    const dd=new Date(e.submittedAt);
    return dd.getFullYear()===now.getFullYear()
        && dd.getMonth()===now.getMonth()
        && dd.getDate()===now.getDate();
  }).length;
  document.getElementById('sTotal').textContent   = t;
  document.getElementById('sUnread').textContent  = u;
  document.getElementById('sSupport').textContent = s;
  document.getElementById('sToday').textContent   = d;
  document.getElementById('chromUnread').textContent = u+(u===1?' Unread':' Unread');
}

/* FILTER */
function filtered() {
  const q = searchQ.toLowerCase();
  return entries.filter(e => {
    const mq = !q
      || (e.name||'').toLowerCase().includes(q)
      || (e.email||'').toLowerCase().includes(q)
      || (e.subject||'').toLowerCase().includes(q)
      || (e.org||'').toLowerCase().includes(q);
    const mf =
      activeFilter==='all'     ? true :
      activeFilter==='unread'  ? e.status==='unread' :
      activeFilter==='support' ? SUPPORT.includes(e.type) :
      activeFilter==='general' ? !ALL_SUPP.includes(e.type) :
      activeFilter==='bug'     ? BUG.includes(e.type) :
      activeFilter==='license' ? LICENSE.includes(e.type) :
      activeFilter==='privacy' ? PRIVACY.includes(e.type) : true;
    return mq && mf;
  });
}

/* SIDEBAR */
function fmtShort(iso) {
  if (!iso) return '';
  const d=new Date(iso), n=new Date();
  return d.toDateString()===n.toDateString()
    ? d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString('en-PH',{month:'short',day:'numeric'});
}

function renderSidebar() {
  const list = document.getElementById('sbList');
  const data = filtered();
  if (!data.length) {
    list.innerHTML = '<div class="sb-empty">No results</div>'; return;
  }
  list.innerHTML = data.map(e => `
    <div class="sb-item ${e.status==='unread'?'unread':''} ${activeKey===e.key?'active':''}"
         data-key="${e.key}">
      <div class="sb-item-top">
        <span class="sb-item-name">${esc(e.name)}</span>
        <span class="sb-item-time">${fmtShort(e.submittedAt)}</span>
      </div>
      <div class="sb-item-sub">
        <span class="sb-type-dot ${dotCls(e.type)}"></span>${esc(e.type)} · ${esc(e.subject)}
      </div>
    </div>`).join('');

  list.querySelectorAll('.sb-item').forEach(el => {
    el.addEventListener('click', () => {
      const e = entries.find(x => x.key===el.dataset.key);
      if (!e) return;
      activeKey = e.key;
      renderSidebar();
      renderDetail(e);
      if (e.status==='unread') update(ref(db,'contacts/'+e.key),{status:'read'});
    });
  });
}

/* DETAIL */
function fmtLong(iso) {
  if (!iso) return '—';
  const d=new Date(iso);
  return d.toLocaleDateString('en-PH',{year:'numeric',month:'long',day:'numeric'})
       + ' at '
       + d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
}
function initials(n) {
  return (n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function renderDetail(e) {
  /* top bar */
  const tb = document.getElementById('topbar');
  tb.classList.remove('empty');
  tb.innerHTML = `
    <div class="topbar-avatar">${initials(e.name)}</div>
    <div class="topbar-info">
      <div class="topbar-name">${esc(e.name)}</div>
      <div class="topbar-meta">
        <span class="topbar-email">${esc(e.email)}</span>
        ${e.org&&e.org!=='—'?`<span class="topbar-sep"></span><span class="topbar-org">${esc(e.org)}</span>`:''}
      </div>
    </div>
    <div class="topbar-actions">
      <button class="tb-btn primary" id="tbReply">✉ Reply</button>
      <button class="tb-btn" id="tbRead">✔ Mark Read</button>
      <button class="tb-btn danger" id="tbDelete">✕ Delete</button>
    </div>`;

  document.getElementById('tbReply').onclick  = () =>
    window.open(`mailto:${e.email}?subject=Re: ${encodeURIComponent(e.subject)}`);
  document.getElementById('tbRead').onclick   = () =>
    update(ref(db,'contacts/'+e.key),{status:'read'});
  document.getElementById('tbDelete').onclick = () => {
    if (confirm(`Delete inquiry from ${e.name}?`)) {
      remove(ref(db,'contacts/'+e.key));
      activeKey = null; clearDetail();
    }
  };

  /* content pane */
  document.getElementById('contentPane').innerHTML = `
    <div class="msg-header">
      <div class="msg-subject">${esc(e.subject)}</div>
      <div class="msg-tags">
        <span class="type-badge ${badgeCls(e.type)}">${esc(e.type)}</span>
        ${e.status==='unread'?'<span class="type-badge badge-unread">● New</span>':''}
        <span class="msg-timestamp">${fmtLong(e.submittedAt)}</span>
      </div>
    </div>
    <div class="meta-grid">
      <div class="meta-cell"><div class="meta-lbl">From</div><div class="meta-val">${esc(e.name)}</div></div>
      <div class="meta-cell"><div class="meta-lbl">Email</div><div class="meta-val">${esc(e.email)}</div></div>
      <div class="meta-cell"><div class="meta-lbl">Organization</div><div class="meta-val">${esc(e.org||'—')}</div></div>
      <div class="meta-cell"><div class="meta-lbl">Inquiry Type</div><div class="meta-val">${esc(e.type)}</div></div>
    </div>
    <div class="msg-body-label">Message</div>
    <div class="msg-body">${esc(e.message)}</div>`;
}

function clearDetail() {
  const tb = document.getElementById('topbar');
  tb.classList.add('empty');
  tb.innerHTML = '<span class="topbar-empty-msg">Select an inquiry to view</span>';
  document.getElementById('contentPane').innerHTML = `
    <div class="pane-empty">
      <div class="pane-empty-glyph">✉</div>
      <p class="pane-empty-txt">No inquiry selected</p>
    </div>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
